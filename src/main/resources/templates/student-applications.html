
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <h2 class="mb-4">My Applications</h2>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Job Title</th>
            <th>Company</th>
            <th>Package (LPA)</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="app : ${applications}">
            <td th:text="${app.jobPosting.title}"></td>
            <td th:text="${app.jobPosting.recruiter.companyName}"></td>
            <td th:text="${app.jobPosting.packageOffered}"></td>
            <td>
                        <span class="badge"
                              th:classappend="${app.status.name() == 'APPLIED'} ? 'bg-secondary' :
                                               (${app.status.name() == 'SHORTLISTED'} ? 'bg-warning text-dark' :
                                               (${app.status.name() == 'SELECTED'} ? 'bg-success' : 'bg-danger'))"
                              th:text="${app.status}"></span>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/student/jobs}" class="btn btn-outline-secondary">Back to Job Postings</a>
</div>
</body>
</html>
