
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Posting Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <h2 class="mb-4" th:text="${jobId} != null ? 'Edit Job Posting' : 'Create Job Posting'"></h2>
    <div class="card p-4 shadow-sm" style="max-width: 600px;">
        <form th:action="${jobId} != null ? @{/recruiter/postings/{id}/edit(id=${jobId})} : @{/recruiter/postings/create}"
              th:object="${jobDTO}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" th:field="*{title}" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Minimum CGPA</label>
                <input type="number" step="0.01" th:field="*{minCgpa}" class="form-control"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Eligible Branch (e.g. CSE, or ALL)</label>
                <input type="text" th:field="*{eligibleBranch}" class="form-control"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Backlogs Allowed?</label>
                <select th:field="*{backlogsAllowed}" class="form-select">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Package Offered (LPA)</label>
                <input type="number" step="0.1" th:field="*{packageOffered}" class="form-control"/>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/recruiter/postings}" class="btn btn-link">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
