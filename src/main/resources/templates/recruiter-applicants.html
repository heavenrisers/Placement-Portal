<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Applicants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <h2 class="mb-4">Applicants for this Job</h2>

    <div th:if="${aiResult}" class="alert alert-info">
        <strong>AI Screening Result (Application #<span th:text="${aiApplicationId}"></span>):</strong><br/>
        <span th:text="${aiResult}"></span>
    </div>
    <div th:if="${aiError}" class="alert alert-warning" th:text="${aiError}"></div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Student Name</th>
            <th>Branch</th>
            <th>CGPA</th>
            <th>Backlogs</th>
            <th>Resume</th>
            <th>Status</th>
            <th>Update</th>
            <th>AI</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="app : ${applicants}">
            <td th:text="${app.student.user.name}"></td>
            <td th:text="${app.student.branch}"></td>
            <td th:text="${app.student.cgpa}"></td>
            <td th:text="${app.student.backlogs}"></td>
            <td>
                <span th:if="${app.student.resumePath != null}" class="text-success">Uploaded ✓</span>
                <span th:unless="${app.student.resumePath != null}" class="text-muted">Not uploaded</span>
            </td>
            <td>
                        <span class="badge"
                              th:classappend="${app.status.name() == 'APPLIED'} ? 'bg-secondary' :
                                               (${app.status.name() == 'SHORTLISTED'} ? 'bg-warning text-dark' :
                                               (${app.status.name() == 'SELECTED'} ? 'bg-success' : 'bg-danger'))"
                              th:text="${app.status}"></span>
            </td>
            <td>
                <form th:action="@{/recruiter/applications/{id}/status(id=${app.id})}" method="post" class="d-flex gap-1">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="jobId" th:value="${jobId}"/>
                    <select name="status" class="form-select form-select-sm">
                        <option value="APPLIED">Applied</option>
                        <option value="SHORTLISTED">Shortlisted</option>
                        <option value="SELECTED">Selected</option>
                        <option value="REJECTED">Rejected</option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-primary">Update</button>
                </form>
            </td>
            <td>
                <form th:action="@{/recruiter/applications/{id}/ai-screen(id=${app.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="jobId" th:value="${jobId}"/>
                    <button type="submit" class="btn btn-sm btn-outline-success">🤖 AI Screen</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/recruiter/postings}" class="btn btn-link">Back to My Postings</a>
</div>
</body>
</html>
