
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Job Postings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <h2 class="mb-4">All Job Postings</h2>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Title</th>
            <th>Company</th>
            <th>Min CGPA</th>
            <th>Branch</th>
            <th>Package (LPA)</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="job : ${postings}">
            <td th:text="${job.title}"></td>
            <td th:text="${job.recruiter.companyName}"></td>
            <td th:text="${job.minCgpa}"></td>
            <td th:text="${job.eligibleBranch}"></td>
            <td th:text="${job.packageOffered}"></td>
            <td>
                <form th:action="@{/admin/postings/{id}/delete(id=${job.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this posting?')">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/admin/dashboard}" class="btn btn-link">Back to Dashboard</a>
</div>
</body>
</html>
