
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Postings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <h2 class="mb-4">Available Job Postings</h2>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Min CGPA</th>
            <th>Branch</th>
            <th>Package (LPA)</th>
            <th>Backlogs Allowed</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="job : ${jobs}">
            <td th:text="${job.title}"></td>
            <td th:text="${job.description}"></td>
            <td th:text="${job.minCgpa}"></td>
            <td th:text="${job.eligibleBranch}"></td>
            <td th:text="${job.packageOffered}"></td>
            <td th:text="${job.backlogsAllowed} ? 'Yes' : 'No'"></td>
            <td>
                <form th:action="@{/student/jobs/{id}/apply(id=${job.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-primary">Apply</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/student/applications}" class="btn btn-outline-secondary">View My Applications</a>
    <a th:href="@{/student/dashboard}" class="btn btn-link">Back to Dashboard</a>
</div>
</body>
</html>
