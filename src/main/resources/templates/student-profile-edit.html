
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <h2 class="mb-4">Edit My Profile</h2>
    <div class="card p-4 shadow-sm" style="max-width: 500px;">
        <form th:action="@{/student/profile/edit}" th:object="${profileDTO}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
                <label class="form-label">Branch</label>
                <input type="text" th:field="*{branch}" class="form-control"/>
            </div>
            <div class="mb-3">
                <label class="form-label">CGPA</label>
                <input type="number" step="0.01" th:field="*{cgpa}" class="form-control"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Backlogs</label>
                <input type="number" th:field="*{backlogs}" class="form-control"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Resume (PDF)</label>
                <input type="file" name="resumeFile" class="form-control" accept=".pdf"/>
                <small class="text-muted">Upload a new PDF to replace your current resume</small>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/student/profile}" class="btn btn-link">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
