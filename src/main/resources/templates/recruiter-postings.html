
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Job Postings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <h2 class="mb-4">My Job Postings</h2>

    <a th:href="@{/recruiter/postings/create}" class="btn btn-primary mb-3">+ Create New Posting</a>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Title</th>
            <th>Min CGPA</th>
            <th>Branch</th>
            <th>Package (LPA)</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="job : ${postings}">
            <td th:text="${job.title}"></td>
            <td th:text="${job.minCgpa}"></td>
            <td th:text="${job.eligibleBranch}"></td>
            <td th:text="${job.packageOffered}"></td>
            <td>
                <a th:href="@{/recruiter/postings/{id}/edit(id=${job.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                <a th:href="@{/recruiter/postings/{id}/applicants(id=${job.id})}" class="btn btn-sm btn-outline-info">Applicants</a>
                <form th:action="@{/recruiter/postings/{id}/delete(id=${job.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this posting?')">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/recruiter/dashboard}" class="btn btn-link">Back to Dashboard</a>
</div>
</body>
</html>
