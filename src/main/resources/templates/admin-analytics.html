<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Placement Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <h2 class="mb-4">Placement Analytics</h2>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card p-3 text-center shadow-sm">
                <h6 class="text-muted">Total Students</h6>
                <h3 th:text="${stats.totalStudents}"></h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center shadow-sm">
                <h6 class="text-muted">Total Placed</h6>
                <h3 th:text="${stats.totalPlaced}"></h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center shadow-sm">
                <h6 class="text-muted">Placement %</h6>
                <h3 th:text="${stats.placementPercent} + '%'"></h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center shadow-sm">
                <h6 class="text-muted">Avg Package (LPA)</h6>
                <h3 th:text="${stats.avgPackage}"></h3>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card p-3 text-center shadow-sm">
                <h6 class="text-muted">Highest Package</h6>
                <h4 th:text="${stats.highestPackage} + ' LPA'"></h4>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 text-center shadow-sm">
                <h6 class="text-muted">Lowest Package</h6>
                <h4 th:text="${stats.lowestPackage} + ' LPA'"></h4>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 text-center shadow-sm">
                <h6 class="text-muted">Companies Hiring</h6>
                <h4 th:text="${stats.companyLabels.size()}"></h4>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card p-3 shadow-sm">
                <h5>Branch-wise: Total vs Placed</h5>
                <canvas id="branchChart"></canvas>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card p-3 shadow-sm">
                <h5>Application Status Funnel</h5>
                <canvas id="statusChart"></canvas>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card p-3 shadow-sm">
                <h5>Company-wise Offers</h5>
                <canvas id="companyChart"></canvas>
            </div>
        </div>
    </div>

    <a th:href="@{/admin/dashboard}" class="btn btn-link">Back to Dashboard</a>
</div>

<script th:inline="javascript">
    const branchLabels = /*[[${stats.branchLabels}]]*/ [];
    const branchTotals = /*[[${stats.branchTotals}]]*/ [];
    const branchPlaced = /*[[${stats.branchPlaced}]]*/ [];

    new Chart(document.getElementById('branchChart'), {
        type: 'bar',
        data: {
            labels: branchLabels,
            datasets: [
                { label: 'Total Students', data: branchTotals, backgroundColor: '#6c757d' },
                { label: 'Placed', data: branchPlaced, backgroundColor: '#198754' }
            ]
        }
    });

    const statusLabels = /*[[${stats.statusLabels}]]*/ [];
    const statusValues = /*[[${stats.statusValues}]]*/ [];

    new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {
            labels: statusLabels,
            datasets: [{ data: statusValues, backgroundColor: ['#6c757d', '#ffc107', '#198754', '#dc3545'] }]
        }
    });

    const companyLabels = /*[[${stats.companyLabels}]]*/ [];
    const companyValues = /*[[${stats.companyValues}]]*/ [];

    new Chart(document.getElementById('companyChart'), {
        type: 'bar',
        data: {
            labels: companyLabels,
            datasets: [{ label: 'Offers Made', data: companyValues, backgroundColor: '#0d6efd' }]
        }
    });
</script>
</body>
</html>
