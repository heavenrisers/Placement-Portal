
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Company Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <h2 class="mb-4">Company Profile</h2>
    <div class="card p-4 shadow-sm" style="max-width: 500px;">
        <form th:action="@{/recruiter/profile}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label">Company Name</label>
                <input type="text" name="companyName" th:value="${companyName}" class="form-control" required/>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/recruiter/dashboard}" class="btn btn-link">Back to Dashboard</a>
        </form>
    </div>
</div>
</body>
</html>
