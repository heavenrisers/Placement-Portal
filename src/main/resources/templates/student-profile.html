
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <h2 class="mb-4">My Profile</h2>
    <div class="card p-4 shadow-sm" style="max-width: 500px;">
        <p><strong>Branch:</strong> <span th:text="${profile.branch} ?: 'Not set'"></span></p>
        <p><strong>CGPA:</strong> <span th:text="${profile.cgpa} ?: 'Not set'"></span></p>
        <p><strong>Backlogs:</strong> <span th:text="${profile.backlogs} ?: 'Not set'"></span></p>
        <p>
            <strong>Resume:</strong>
            <span th:if="${profile.resumePath != null}">Uploaded ✓</span>
            <span th:unless="${profile.resumePath != null}">Not uploaded</span>
        </p>
        <a th:href="@{/student/profile/edit}" class="btn btn-primary mt-2">Edit Profile</a>
    </div>
    <a th:href="@{/student/dashboard}" class="btn btn-link mt-3">Back to Dashboard</a>
</div>
</body>
</html>
